name: docker

on:
  push:
    branches: [master]
    paths-ignore:
      - '.github/**'
      - '.vscode/**'
      - 'chrome-extension/**'
      - 'releases/**'
      - '**/**.md'
      - '**.crx'
      - '**.pem'
      - '.dockerignore'
      - '.gitignore'
  schedule:
    - cron:  '34 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Detect DockerHub credentials
        id: creds
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DH_REPO: ${{ secrets.DOCKERHUB_REPO }}
          DH_TAG: ${{ secrets.DOCKERHUB_MASTER_TAG }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "dockerhub=true" >> $GITHUB_OUTPUT
            echo "repo=${DH_REPO:-${{ github.event.repository.name }}}" >> $GITHUB_OUTPUT
            echo "images=ghcr.io/${{ github.repository_owner }}/${DH_REPO:-${{ github.event.repository.name }}}\n${DH_USER}/${DH_REPO:-${{ github.event.repository.name }}}" >> $GITHUB_OUTPUT
          else
            echo "dockerhub=false" >> $GITHUB_OUTPUT
            echo "repo=${DH_REPO:-${{ github.event.repository.name }}}" >> $GITHUB_OUTPUT
            echo "images=ghcr.io/${{ github.repository_owner }}/${DH_REPO:-${{ github.event.repository.name }}}" >> $GITHUB_OUTPUT
          fi
          echo "tag=${DH_TAG:-nightly}" >> $GITHUB_OUTPUT

      - name: Set hash
        id: vars
        run: echo "::set-output name=sha_short::$(git rev-parse --short HEAD)"

      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date +'%Y-%m-%d')"

      - name: create-json
        id: create-json
        uses: jsdaniell/create-json@v1.2.2
        with:
          name: "version.json"
          json: '{"type": "docker", "tag": "${{ steps.creds.outputs.tag }}", "commit": "${{ steps.vars.outputs.sha_short }}", "date": "${{ steps.date.outputs.date }}"}'
          dir: 'backend/'

      - name: setup platform emulator
        uses: docker/setup-qemu-action@v3

      - name: setup multi-arch docker build
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker image metadata
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.creds.outputs.images }}
          tags: |
            type=raw,${{ steps.creds.outputs.tag }}-{{ date 'YYYY-MM-DD' }}
            type=raw,${{ steps.creds.outputs.tag }}
            type=sha,prefix=sha-,format=short

      - name: Login to DockerHub
        if: steps.creds.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build & push images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64/v8,linux/arm/v7
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
